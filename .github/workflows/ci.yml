name: ci

on:
  push:
    branches: [main]
    paths:
      - "lua/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".luacheckrc"
  pull_request:
    branches: [main]
    paths:
      - "lua/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".luacheckrc"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint
        run: luacheck lua scripts --codes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      - name: Smoke test
        run: nvim --headless -l scripts/smoke_test.lua

      - name: Contrast check
        run: nvim --headless -l scripts/contrast_check.lua